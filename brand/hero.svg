<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="title">
  <title id="title">CortexOS — An operating layer for agents and tools</title>
  <desc id="desc">深色底板上的出框标志与 CortexOS 字标。</desc>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4F46E5"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
    <linearGradient id="breakout" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5EEAD4"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
  </defs>
  <rect width="1280" height="360" rx="24" fill="#0B0C10"/>
  <g transform="translate(64,50) scale(1.3)">
    <path fill-rule="evenodd" fill="url(#frame)" d="M20 20 H180 V72 H152 V48 H48 V152 H152 V128 H180 V180 H20 Z"/>
