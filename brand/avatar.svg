<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title">
  <title id="title">CortexOS 组织头像</title>
  <desc id="desc">深色底板上的出框标志；GitHub 组织头像会被圆形裁切，因此底板为方形不透明。</desc>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4F46E5"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
    <linearGradient id="breakout" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5EEAD4"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" fill="#0B0C10"/>
  <g transform="translate(76.8,76.8) scale(1.792)">
    <path fill-rule="evenodd" fill="url(#frame)" d="M20 20 H180 V72 H152 V48 H48 V152 H152 V128 H180 V180 H20 Z"/>
    <rect x="100" y="78" width="80" height="44" rx="4" fill="url(#breakout)"/>
  </g>
</svg>
